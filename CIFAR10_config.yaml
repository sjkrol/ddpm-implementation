model:
  channel_multipliers: [1, 2, 2, 2]
  base_channels: 128
  num_res_blocks: 2
  in_resolution: 32
  T: 1000
  beta_start: 0.0001
  beta_end: 0.02

precision:
  mode: mixed

training:
  batch_size: 128
  lr: 2e-4
  warmup_steps: 5000
  distributed:
    enabled: false
    backend: nccl
    init_method: env://
    find_unused_parameters: false
  lr_scheduler:
    step_size: 10
    gamma: 0.1
  num_epochs: 2051

evaluation:
  fid_samples: 1000
  fid_batch_size: 256
  fid_eval_interval: 100
  fid_feature: 64

wandb:
  enabled: true
  project: ddpm-cifar10
  entity: "stephen-krol-monash-university"
  run_name: test-run-7
  mode: online
  log_every_steps: 10
  tags: [ddpm, cifar10]
  notes: null