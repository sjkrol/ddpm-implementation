model:
  channel_multipliers: [1, 1, 2, 2, 4, 4]
  base_channels: 128
  num_res_blocks: 2
  in_resolution: 256
  T: 1000
  beta_start: 0.0001
  beta_end: 0.02

precision:
  mode: mixed

training:
  batch_size: 20
  lr: 2e-5
  warmup_steps: 5000
  distributed:
    enabled: true
    backend: nccl
    init_method: env://
    find_unused_parameters: false
  lr_scheduler:
    step_size: 10
    gamma: 0.1
  num_epochs: 3

evaluation:
  fid_samples: 50000
  fid_batch_size: 256

wandb:
  enabled: true
  project: ddpm-celeba-hq
  entity: "stephen-krol-monash-university"
  run_name: mixed-precision-test
  mode: online
  log_every_steps: 10
  tags: [ddpm, celeba-hq]
  notes: null